* { box-sizing: border-box; margin: 0; padding: 0; }

header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }

.badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--muted); }

.tab { padding: 6px 16px; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: var(--bg3); font-size: 13px; transition: all .2s; }
.tab:first-child { border-radius: 6px 0 0 6px; }
.tab:last-child { border-radius: 0 6px 6px 0; }
.tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
#searchBox { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 13px; width: 220px; }

.panel { display: none; padding: 20px 24px; }

.rcard-size { color: var(--orange); font-size: 12px; white-space:nowrap; }
.rcard-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space:nowrap; }

.b-wordlist { background: rgba(158,203,255,.1); color: #9ecbff; border: 1px solid rgba(158,203,255,.3); }
.b-tool { background: rgba(255,215,0,.1); color: #ffd700; border: 1px solid rgba(255,215,0,.3); }
.rcard-body { display: none; padding: 14px 16px; border-top: 1px solid var(--border); }
.rcard-body.open { display: block; }
.rcard-body p { color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.rcard-body h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; margin-top: 8px; }

.tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; font-family: monospace; }
.tag.c { color: #bc8cff; }
.tag.f { color: #58a6ff; }
.tag.d { color: #ffa657; }
.section-header { font-size: 16px; font-weight: 700; color: var(--blue); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }

.hidden { display: none !important; }
.highlight-card { border-color: var(--blue) !important; box-shadow: 0 0 0 2px rgba(88,166,255,.3); }
</style>

const TYPE_ORDER=['entry','core','scanner','integration','reporter','cli','config','test','wordlist','tool'];
const TYPE_LABEL={entry:'GIRIS NOKTALARI',core:'CEKIRDEK MODULLER',scanner:'SCANNER MODULLER',integration:'ENTEGRASYONLAR',reporter:'RAPORLAYICILAR',cli:'CLI / API',config:'KONFIGURASYON',test:'TESTLER',wordlist:'WORDLISTLER',tool:'ARACLAR'};
const TYPE_ICONS={entry:'🚀',core:'⚙️',scanner:'🔍',integration:'🔗',reporter:'📊',cli:'💻',config:'📋',test:'🧪',wordlist:'📝',tool:'🛠️'};

function switchTab(name){
  document.getElementById('treePanel').classList.toggle('active',name==='tree');
  document.getElementById('reportPanel').classList.toggle('active',name==='report');
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&name==='tree')||(i===1&&name==='report'));
  });
}

function toggleNode(id){
  const ch=document.getElementById('ch_'+id);
  const arr=document.getElementById('arr_'+id);
  if(!ch)return;
  const open=ch.classList.toggle('open');
  if(arr)arr.classList.toggle('open',open);
}

function toggleCard(header){
  header.nextElementSibling.classList.toggle('open');
}

function showDetail(path){
  switchTab('report');
  filterAll('');
  setTimeout(()=>{
    document.querySelectorAll('.rcard').forEach(c=>{
      if(c.dataset.path===path.toLowerCase()){
        c.scrollIntoView({behavior:'smooth',block:'center'});
        const body=c.querySelector('.rcard-body');
        if(body)body.classList.add('open');
        c.classList.add('highlight-card');
        setTimeout(()=>c.classList.remove('highlight-card'),2500);
      }
    });
  },150);
}

function filterAll(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.rcard').forEach(c=>{
    c.classList.toggle('hidden',!(!q||c.dataset.path.includes(q)||c.querySelector('.rcard-path').textContent.toLowerCase().includes(q)||c.querySelector('.rcard-body').textContent.toLowerCase().includes(q)));
  });
  document.querySelectorAll('.tree-item[data-path]').forEach(item=>{
    const match=!q||item.dataset.path.includes(q)||item.textContent.toLowerCase().includes(q);
    item.classList.toggle('hidden',!match);
  });
}

// Build nested tree from flat list
function buildNodes(files){
  const root={_f:[],_d:{}};
  files.forEach(f=>{
    const parts=f.path.replace(/\\/g,'/').split('/');
    let node=root;
    parts.forEach((p,i)=>{
      if(i===parts.length-1){node._f.push(f);}
      else{
        if(!node._d[p])node._d[p]={_f:[],_d:{}};
        node=node._d[p];
      }
    });
  });
  return root;
}

function countDeep(node){
  let c=(node._f||[]).length;
  Object.values(node._d||{}).forEach(ch=>c+=countDeep(ch));
  return c;
}

function renderLeaf(f){
  const fname=f.path.split('/').pop();
  const icon=TYPE_ICONS[f.type]||'📄';
  const shortDesc=f.desc.length>70?f.desc.substring(0,70)+'...':f.desc;
  return `<div class="tree-item t-${f.type}" data-path="${f.path.toLowerCase()}" onclick="showDetail('${f.path.replace(/'/g,"\\'")}')">
    <span class="arrow" style="opacity:0">&#9658;</span>
    <span class="icon">${icon}</span>
    <span class="node-label"><span class="fname">${fname}</span><span class="fsize">${f.size}</span><span class="fdesc">${shortDesc}</span></span>
  </div>`;
}

function renderDir(name,node,path){
  const id='d_'+path.replace(/[^a-z0-9]/gi,'_');
  const total=countDeep(node);
  const childDirs=Object.keys(node._d||{}).sort();
  let html=`<div class="tree-node">
    <div class="tree-item t-dir" onclick="toggleNode('${id}')">
      <span class="arrow" id="arr_${id}">&#9658;</span>
      <span class="icon">📁</span>
      <span class="node-label"><span class="fname">${name}/</span><span class="fdesc">${total} dosya</span></span>
    </div>
    <div class="tree-children" id="ch_${id}">`;
  childDirs.forEach(c=>{
    html+=renderDir(c,node._d[c],path+'/'+c);
  });
  (node._f||[]).forEach(f=>html+=renderLeaf(f));
  html+='</div></div>';
  return html;
}

function buildReport(files){
  const sections={};
  files.forEach(f=>{
    if(!sections[f.type])sections[f.type]=[];
    sections[f.type].push(f);
  });
  let html='';
  TYPE_ORDER.forEach(t=>{
    if(!sections[t])return;
    html+=`<div class="section-header">${TYPE_LABEL[t]} &nbsp;<span style="font-size:13px;color:var(--muted);font-weight:400">(${sections[t].length} dosya)</span></div>`;
    sections[t].forEach(f=>{
      const cTags=f.classes.map(c=>`<span class="tag c">${c}</span>`).join('');
      const fTags=f.funcs.map(fn=>`<span class="tag f">${fn}</span>`).join('');
      const dTags=f.deps.map(d=>`<span class="tag d">${d.split('/').pop()}</span>`).join('');
      html+=`<div class="rcard" data-path="${f.path.toLowerCase()}">
        <div class="rcard-header" onclick="toggleCard(this)">
          <span class="rcard-path">${f.path}</span>
          <span class="rcard-size">${f.size}</span>
          <span class="rcard-badge b-${f.type}">${t.toUpperCase()}</span>
        </div>
        <div class="rcard-body">
          <p>${f.desc}</p>
          ${f.classes.length?`<h4>Siniflar</h4><div class="tag-list">${cTags}</div>`:''}
          ${f.funcs.length?`<h4>Ana Fonksiyonlar</h4><div class="tag-list">${fTags}</div>`:''}
          ${f.deps.length?`<h4>Bagimliliklar</h4><div class="tag-list">${dTags}</div>`:''}
        </div>
      </div>`;
    });
  });
  return html;
}

document.addEventListener('DOMContentLoaded',()=>{
  // Tree
  const root=buildNodes(FILES);
  let treeHtml='';
  // Top-level items: files first then dirs (but really we have dirs like CLAUDE.md at top)
  (root._f||[]).forEach(f=>treeHtml+=renderLeaf(f));
  Object.keys(root._d||{}).sort().forEach(name=>{
    treeHtml+=renderDir(name,root._d[name],name);
  });
  document.getElementById('treeRoot').innerHTML=treeHtml;

  // Report
  document.getElementById('reportGrid').innerHTML=buildReport(FILES);
});
</script>
