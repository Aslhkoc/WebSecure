<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSecure — Proje Haritası</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',monospace;font-size:13px;}
h1{text-align:center;padding:24px 0 6px;font-size:22px;color:#58a6ff;letter-spacing:2px;}
.subtitle{text-align:center;color:#8b949e;margin-bottom:18px;font-size:12px;}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.tab{padding:8px 28px;border-radius:6px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:#161b22;color:#8b949e;transition:all .2s;}
.tab.active{background:#1f6feb;color:#fff;border-color:#1f6feb;}
.pane{display:none;padding:0 18px 40px;}
.pane.active{display:block;}

/* ===== TREE PANEL ===== */
#tree-root{max-width:1200px;margin:0 auto;}
.tree-node{margin-left:0;}
.tree-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;cursor:pointer;user-select:none;transition:background .15s;white-space:nowrap;}
.tree-item:hover{background:#21262d;}
.tree-item .arrow{width:14px;color:#58a6ff;font-size:11px;flex-shrink:0;}
.tree-item .icon{font-size:14px;flex-shrink:0;}
.tree-item .label{font-size:12.5px;flex:1;}
.tree-item .badge{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;flex-shrink:0;}
.tree-children{display:none;margin-left:22px;border-left:1px solid #21262d;padding-left:4px;}
.tree-children.open{display:block;}

/* badge colors */
.b-core{background:#0d419d;color:#79c0ff;}
.b-scanner{background:#1a472a;color:#56d364;}
.b-wordlist{background:#5a1e02;color:#ffa657;}
.b-config{background:#3d1f00;color:#f0883e;}
.b-test{background:#2d1f69;color:#d2a8ff;}
.b-integration{background:#1b2a3b;color:#58a6ff;}
.b-cli{background:#3b2300;color:#e3b341;}
.b-db{background:#1c1c2e;color:#bc8cff;}
.b-api{background:#1a2d1a;color:#3fb950;}
.b-driver{background:#2a1f1a;color:#ff7b72;}
.b-web{background:#1a2530;color:#79c0ff;}

/* file detail popup */
.detail{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#161b22;border:1px solid #30363d;border-radius:10px;padding:22px 26px;
  max-width:600px;width:92%;z-index:999;box-shadow:0 8px 40px #000a;}
.detail h3{color:#58a6ff;margin-bottom:10px;font-size:15px;}
.detail .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.detail .tag{font-size:11px;padding:2px 8px;border-radius:8px;border:1px solid #30363d;}
.detail .desc{color:#8b949e;line-height:1.6;font-size:12.5px;margin-bottom:12px;}
.detail .deps h4{color:#e3b341;font-size:12px;margin-bottom:6px;}
.detail .deps ul{list-style:none;display:flex;flex-wrap:wrap;gap:5px;}
.detail .deps ul li{background:#21262d;padding:2px 8px;border-radius:4px;font-size:11px;color:#79c0ff;}
.detail .close-btn{position:absolute;top:10px;right:14px;cursor:pointer;color:#8b949e;font-size:18px;}
.overlay{display:none;position:fixed;inset:0;background:#000000aa;z-index:998;}

/* ===== REPORT PANEL ===== */
#report-root{max-width:1200px;margin:0 auto;}
.search-box{width:100%;padding:8px 14px;background:#161b22;border:1px solid #30363d;
  border-radius:6px;color:#c9d1d9;font-size:13px;margin-bottom:16px;outline:none;}
.search-box:focus{border-color:#1f6feb;}
.category-header{background:#161b22;border:1px solid #30363d;border-radius:8px;
  padding:10px 16px;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:13px;color:#c9d1d9;transition:background .15s;}
.category-header:hover{background:#21262d;}
.category-content{display:none;margin-bottom:10px;}
.category-content.open{display:block;}
.file-card{background:#0d1117;border:1px solid #21262d;border-radius:6px;
  padding:12px 16px;margin:4px 0;transition:border-color .2s;}
.file-card:hover{border-color:#58a6ff;}
.file-card h4{color:#58a6ff;font-size:12.5px;font-family:monospace;margin-bottom:5px;}
.file-card .fc-desc{color:#8b949e;font-size:12px;line-height:1.55;margin-bottom:7px;}
.file-card .fc-deps{display:flex;flex-wrap:wrap;gap:4px;}
.file-card .fc-dep{background:#21262d;color:#79c0ff;font-size:10.5px;padding:1px 7px;border-radius:4px;}
.file-card .fc-type{font-size:10px;padding:1px 7px;border-radius:8px;float:right;margin-top:-2px;}
.hidden{display:none;}
</style>
</head>
<body>

<h1>🔐 WebSecure — Proje Haritası</h1>
<p class="subtitle">v20.0.0 · Tüm dosyalar · İnteraktif ağaç + detaylı rapor</p>

<div class="tabs">
  <div class="tab active" onclick="switchTab('tree')">🌳 İnteraktif Ağaç</div>
  <div class="tab" onclick="switchTab('report')">📋 Detaylı Rapor</div>
</div>

<!-- ========================== TREE PANE ========================== -->
<div id="pane-tree" class="pane active">
<div id="tree-root"></div>
</div>

<!-- ========================== REPORT PANE ========================== -->
<div id="pane-report" class="pane">
<div id="report-root">
<input class="search-box" type="text" placeholder="🔍 Dosya adı veya açıklama ara..." oninput="filterReport(this.value)">
<div id="report-content"></div>
</div>
</div>

<!-- Detail Popup -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail" id="detail-box">
  <span class="close-btn" onclick="closeDetail()">✕</span>
  <h3 id="d-title"></h3>
  <div class="meta" id="d-meta"></div>
  <div class="desc" id="d-desc"></div>
  <div class="deps" id="d-deps"></div>
</div>

<script>
// =====================================================================
// DATA
// =====================================================================
const FILES = [
  // ---- KÖK ----
  {id:"config_json", path:"config.json", type:"config", icon:"⚙️",
   desc:"Ana yapılandırma dosyası. Hedef URL, tarama profili (aggressive/stealth), auth ayarları, proxy, rapor formatı, bildirim kanalları (Slack/Teams/PagerDuty), WAF bypass, rate limit, OAST/interactsh endpoint ve tüm modül açma/kapama ayarlarını içerir.",
   deps:["websecure/core/utils/config.py","config.schema.json","websecure/core/profiles.py","websecure/core/scan_profile.py"]},
  {id:"config_schema", path:"config.schema.json", type:"config", icon:"📐",
   desc:"config.json'un JSON Schema doğrulama dosyası. Startup'ta config.json bu schema'ya göre validate edilir. Hatalı config kullanımını önler.",
   deps:["config.json","websecure/core/startup.py"]},
  {id:"install_py", path:"install.py", type:"tool", icon:"🔧",
   desc:"Otomatik kurulum scripti. Gerekli Python paketlerini, harici araçları (nmap, nuclei, amass, dalfox, ffuf, httpx, katana) ve Chrome driver'ı kurar/günceller.",
   deps:["drivers/chromedriver.exe","websecure/core/startup.py"]},
  {id:"pytest_ini", path:"pytest.ini", type:"config", icon:"🧪",
   desc:"Pytest yapılandırması. Test dizini (tests/), timeout (30s), çıktı formatı ve test dosya/sınıf/fonksiyon adı desenlerini tanımlar.",
   deps:["tests/"]},
  {id:"claude_md", path:"CLAUDE.md", type:"config", icon:"📝",
   desc:"Claude AI geliştirme kuralları. SOLID prensipleri, OOP zorunluluğu, git push kuralları ve dosya yönetim politikalarını içerir.",
   deps:[]},
  {id:"session_json", path:"session.json", type:"config", icon:"💾",
   desc:"Aktif tarama oturumu verisi. Checkpoint/resume için tarama durumu, bulunan endpoint'ler ve tamamlanan fazlar buraya kaydedilir.",
   deps:["websecure/core/checkpoint.py","websecure/core/session_manager.py"]},

  // ---- DRIVERS ----
  {id:"chromedriver", path:"drivers/chromedriver.exe", type:"driver", icon:"🌐",
   desc:"Google Chrome WebDriver binary. Playwright/Selenium tabanlı taramalar, DOM XSS tespiti ve JS-heavy SPA crawling için kullanılır.",
   deps:["websecure/core/browser_crawler.py","websecure/scanners/dom_xss.py"]},
  {id:"interactsh", path:"drivers/interactsh-client.exe", type:"driver", icon:"📡",
   desc:"Out-of-Band (OAST) interaktif callback sunucusu. Kör SSRF, XXE, SSTI ve RCE tespitlerinde DNS/HTTP callback altyapısını sağlar.",
   deps:["websecure/core/oast.py","websecure/scanners/ssrf_xxe.py","websecure/integrations/nuclei.py"]},

  // ---- websecure/__init__.py ----
  {id:"ws_init", path:"websecure/__init__.py", type:"core", icon:"📦",
   desc:"Ana paket init dosyası. Versiyon (v20.0.0), DB modelleri, FP learner, CVSS skorer ve temel bileşenleri lazy-import ile başlatır. Geriye dönük uyumluluk katmanı içerir.",
   deps:["websecure/core/utils/__init__.py","websecure/scanners/base.py","websecure/db/__init__.py","websecure/core/fp_learner.py"]},
  {id:"ws_main", path:"websecure/__main__.py", type:"core", icon:"🚀",
   desc:"Python modül giriş noktası. `python -m websecure` komutunu `main()` fonksiyonuna yönlendirir.",
   deps:["websecure/main.py"]},

  // ---- API ----
  {id:"api_server", path:"websecure/api/server.py", type:"api", icon:"🌐",
   desc:"Saf stdlib REST API sunucusu (Flask/FastAPI yok). GET/POST /api/v1/scans, /findings, /health, /score endpoint'leri. Tarama başlatma, bulgu sorgulama, FP işaretleme ve skor görüntüleme destekler.",
   deps:["websecure/db/repository.py","websecure/core/reporting.py","websecure/core/score_tracker.py"]},

  // ---- CLI ----
  {id:"cli_commands", path:"websecure/cli/commands.py", type:"cli", icon:"⌨️",
   desc:"Ana CLI giriş noktası. scan, init, diff, serve, queue, schedule, completion alt komutlarını yönetir. TUI + webhook entegrasyonu ile tarama başlatır.",
   deps:["websecure/cli/tui.py","websecure/cli/wizard.py","websecure/cli/diff.py","websecure/cli/queue_manager.py","websecure/cli/scheduler.py","websecure/cli/webhook.py","websecure/cli/web_ui.py"]},
  {id:"cli_tui", path:"websecure/cli/tui.py", type:"cli", icon:"🖥️",
   desc:"İnteraktif Terminal Arayüzü (TUI). Rich kütüphanesi varsa canlı bulgu tablosu + progress bar + log paneli; yoksa sade metin fallback. SOLID: RichTUI/PlainTUI her ikisi de BaseTUI'dan türer.",
   deps:["websecure/core/reporting.py","websecure/core/live_monitor.py"]},
  {id:"cli_wizard", path:"websecure/cli/wizard.py", type:"cli", icon:"🧙",
   desc:"`websecure init` komutunun interaktif sihirbazı. Hedef URL, profil, auth, proxy, rapor formatı ve bildirim kanalı sorularını sorarak config.json üretir.",
   deps:["config.json","websecure/core/utils/config.py"]},
  {id:"cli_diff", path:"websecure/cli/diff.py", type:"cli", icon:"🔀",
   desc:"İki tarama sonucu JSON'unu karşılaştırır. SHA256 fingerprint bazlı eşleşme; yeni/düzelen/gerileyen/değişmeyen bulguları listeler.",
   deps:["websecure/core/reporting.py"]},
  {id:"cli_queue", path:"websecure/cli/queue_manager.py", type:"cli", icon:"📋",
   desc:"Çok hedefli tarama kuyruğu yöneticisi. JSON kalıcılık (~/.websecure/queue.json), FIFO + öncelik, paralel işleme, pending/running/completed/failed/cancelled durumları.",
   deps:["websecure/cli/commands.py","websecure/core/scan_runner.py"]},
  {id:"cli_scheduler", path:"websecure/cli/scheduler.py", type:"cli", icon:"⏰",
   desc:"Cron tabanlı tarama zamanlama sistemi. Cron ifadesi desteği, JSON kalıcılık, arka plan daemon thread, APScheduler bağımlılığı yok.",
   deps:["websecure/cli/queue_manager.py"]},
  {id:"cli_webhook", path:"websecure/cli/webhook.py", type:"cli", icon:"🔔",
   desc:"Bulgu ve tarama olaylarını HTTP webhook ile dışarı gönderir. on_finding/on_critical/on_complete/on_error. 3x retry, üstel geri çekilme, HMAC-SHA256 imzalama, async gönderim.",
   deps:["websecure/core/reporting.py","websecure/core/notification.py"]},
  {id:"cli_web_ui", path:"websecure/cli/web_ui.py", type:"cli", icon:"🌐",
   desc:"Yerel HTTP web dashboard (stdlib only). Canlı bulgu tablosu (SSE/polling), tarama durumu, log paneli. /api/status, /api/findings, /api/logs, POST /api/scan endpoint'leri.",
   deps:["websecure/web/index.html","websecure/core/reporting.py"]},
  {id:"cli_autocomplete", path:"websecure/cli/autocomplete.py", type:"cli", icon:"✨",
   desc:"Bash/Zsh/Fish shell tamamlama betikleri üretici. `websecure completion bash/zsh/fish` komutuyla shell'e yüklenir.",
   deps:["websecure/cli/commands.py"]},

  // ---- CONFIG / PLAYBOOKS ----
  {id:"pb_cmdi", path:"websecure/config/playbooks/cmdi_persistence.yml", type:"config", icon:"📜",
   desc:"CMDI → Kalıcı Erişim exploit zinciri playbook'u. OS Command Injection bulgusu tespit edilince otomatik reverse shell + crontab backdoor zincirini tetikler.",
   deps:["websecure/core/chain_reactor.py","websecure/scanners/cmdi.py"]},
  {id:"pb_cors", path:"websecure/config/playbooks/cors_jwt_ato.yml", type:"config", icon:"📜",
   desc:"CORS Misconfiguration → JWT Çalma → Account Takeover zinciri. CORS + JWT bulguları bir arada tespit edilince tam ATO zincirini otomatik çalıştırır.",
   deps:["websecure/core/chain_reactor.py","websecure/scanners/cors.py","websecure/scanners/jwt.py"]},
  {id:"pb_ssti", path:"websecure/config/playbooks/ssti_rce_data_exfil.yml", type:"config", icon:"📜",
   desc:"SSTI → RCE → Veri Sızıntısı zinciri playbook'u. Template injection üzerinden RCE ve hassas veri exfil zincirini otomatik çalıştırır.",
   deps:["websecure/core/chain_reactor.py","websecure/scanners/ssti.py"]},
  {id:"pb_xxe", path:"websecure/config/playbooks/xxe_ssrf_internal.yml", type:"config", icon:"📜",
   desc:"XXE → SSRF → İç Ağ Erişimi zinciri. XXE aracılığıyla SSRF'e pivot atıp iç ağ servislerine erişim zincirini tetikler.",
   deps:["websecure/core/chain_reactor.py","websecure/scanners/ssrf_xxe.py"]},
  {id:"prof_api", path:"websecure/config/profiles/api_only.yml", type:"config", icon:"🔷",
   desc:"API-Only tarama profili. REST/GraphQL/gRPC API yüzeyini tarar. Tarayıcı tabanlı scanner'lar ve subdomain devre dışı; auth/IDOR/SQLi/SSRF/mass-assignment odaklı.",
   deps:["websecure/core/profiles.py","websecure/core/scan_profile.py"]},
  {id:"prof_auth", path:"websecure/config/profiles/authenticated.yml", type:"config", icon:"🔷",
   desc:"Kimlik doğrulamalı tarama profili. Oturum gerektiren endpoint'lere erişim için session/token/cookie yönetimini aktif eder.",
   deps:["websecure/core/auth_manager.py","websecure/core/profiles.py"]},
  {id:"prof_bb", path:"websecure/config/profiles/bug_bounty.yml", type:"config", icon:"🔷",
   desc:"Bug Bounty profili. Minimum false positive, OOB/OAST ile kör tespit, güçlü WAF bypass. Sadece doğrulanmış Critical/High bulgular raporlanır.",
   deps:["websecure/core/waf_bypass.py","websecure/core/oast.py","websecure/core/fp_reducer.py","websecure/core/profiles.py"]},
  {id:"prof_cicd", path:"websecure/config/profiles/cicd.yml", type:"config", icon:"🔷",
   desc:"CI/CD pipeline tarama profili. Hızlı, sessiz tarama; CI gate ile yüksek/kritik bulgu varsa build'i durdurur.",
   deps:["websecure/core/profiles.py","websecure/core/reporting.py"]},
  {id:"prof_compliance", path:"websecure/config/profiles/compliance.yml", type:"config", icon:"🔷",
   desc:"Uyumluluk (OWASP Top-10 / PCI-DSS) tarama profili. Standart güvenlik kontrollerini sistematik olarak denetler.",
   deps:["websecure/scanners/owasp.py","websecure/core/profiles.py"]},

  // ---- CORE ----
  {id:"core_alerts", path:"websecure/core/alerts.py", type:"core", icon:"🔔",
   desc:"Ses uyarı yöneticisi (AlertManager). Critical/High/Medium bulgularda farklı frekanslarda sesli bip uyarısı verir. winsound kullanır, thread-safe.",
   deps:["websecure/core/reporting.py"]},
  {id:"core_analysis", path:"websecure/core/analysis.py", type:"core", icon:"🔬",
   desc:"Konsolide analiz modülü. Regex güvenliği, endpoint depolama, anomali tespiti, WAF tespiti + atlatma, CAPTCHA çözme, login sayfası keşfi bileşenlerini içerir.",
   deps:["websecure/core/http.py","websecure/core/payloads.py"]},
  {id:"core_async", path:"websecure/core/async_runner.py", type:"core", icon:"⚡",
   desc:"Tam async I/O tarama motoru. asyncio + aiohttp tabanlı, semaphore ile concurrency kontrolü, connection pooling, timeout/retry. CPU-bound olmayan taramalar için kullanılır.",
   deps:["websecure/core/http.py","websecure/core/reporting.py"]},
  {id:"core_auth_flow", path:"websecure/core/auth_flow.py", type:"core", icon:"🔑",
   desc:"Kimlik doğrulama akış modülü. smart_login, form login, CSRF token yenileme, session canlılık kontrolü, WebDriver senkronizasyonu, rol bazlı session oluşturma fonksiyonları.",
   deps:["websecure/core/http.py","websecure/core/auth/flows.py","websecure/core/auth/providers.py"]},
  {id:"core_auth_mgr", path:"websecure/core/auth_manager.py", type:"core", icon:"🛡️",
   desc:"Kimlik doğrulamalı tarama orkestratörü. form/basic/bearer/cookie/api_key/jwt auth tiplerini destekler. AuthManager.authenticate(ctx) ile tüm tarama oturumunu yetkili hale getirir.",
   deps:["websecure/core/auth_flow.py","websecure/core/session_factory.py"]},
  {id:"core_bl_conc", path:"websecure/core/bl_concurrency.py", type:"core", icon:"⚙️",
   desc:"Business logic concurrency yardımcıları. HTTP session ile paralel istek atma, rate-limit farkında thread pool yönetimi.",
   deps:["websecure/core/http.py","websecure/core/rate_controller.py"]},
  {id:"core_browser", path:"websecure/core/browser_crawler.py", type:"core", icon:"🌐",
   desc:"Playwright tabanlı Tier-2 tarayıcı crawler'ı. JavaScript-heavy SPA'lar için. HTTP crawler az endpoint bulunca devreye girer; form submit, JS event, XHR/fetch yakalama.",
   deps:["drivers/chromedriver.exe","websecure/core/crawler.py"]},
  {id:"core_chain", path:"websecure/core/chain_reactor.py", type:"core", icon:"⛓️",
   desc:"Otomatik Exploit Zinciri Motoru v3.0. ExploitGraph (DAG), ChainNode/ChainEdge, 10+ ChainRule, PlaybookLoader (YAML), CVSSChainCalculator, MultiHopDetector (DFS). XSS+CSRF→ATO, SQLi→CredDump→ATO, SSRF→CloudCompromise zincirlerini otomatik oluşturur.",
   deps:["websecure/config/playbooks/*.yml","websecure/core/cvss.py","websecure/core/reporting.py"]},
  {id:"core_checkpoint", path:"websecure/core/checkpoint.py", type:"core", icon:"💾",
   desc:"Tarama durumu kaydet/devam et sistemi. Atomik JSON write (temp→rename), tamamlanan fazlar + endpoint listesini saklar. Kesilen taramaları kaldığı yerden devam ettirir.",
   deps:["session.json","websecure/core/reporting.py"]},
  {id:"core_circuit", path:"websecure/core/circuit_breaker.py", type:"core", icon:"⚡",
   desc:"Tarama seviyesi devre kesici. CLOSED→OPEN→HALF-OPEN state machine. HTTP blok oranı eşiği aşılınca taramayı durdurur; CircuitBreakerTripped exception fırlatır.",
   deps:["websecure/core/http.py","websecure/core/exceptions.py"]},
  {id:"core_conc", path:"websecure/core/concurrency.py", type:"core", icon:"🔄",
   desc:"Eşzamanlılık ve dayanıklılık motoru. ScanTask (öncelik+meta), PriorityTaskQueue (heapq, thread-safe), ScanDeduplicator (SHA256+LRU). Aynı parametreyi tekrar test etmeyi önler.",
   deps:["websecure/core/exceptions.py"]},
  {id:"core_corr", path:"websecure/core/correlation_engine.py", type:"core", icon:"🔗",
   desc:"Çapraz tarama korelasyon motoru. Fingerprint eşleşme, escalation tespiti, zincir tespiti (SQLi+IDOR→Veri Sızıntısı), persistence tespiti (N tarama boyunca düzelmemiş bulgular).",
   deps:["websecure/core/chain_reactor.py","websecure/db/repository.py"]},
  {id:"core_crawler", path:"websecure/core/crawler.py", type:"core", icon:"🕷️",
   desc:"Tier-1 HTTP crawler + gelişmiş endpoint keşif. HTTPCrawler (BFS, link/form/JS), OpenAPIImporter (Swagger 2.x/3.x), GraphQLSchemaImporter, GRPCProber, APIVersionScanner, ParameterMiner, FormMutationFuzzer, SitemapGenerator. CrawlerOrchestrator tümünü koordine eder.",
   deps:["websecure/core/http.py","websecure/core/analysis.py","websecure/core/form_parser.py"]},
  {id:"core_cvss", path:"websecure/core/cvss.py", type:"core", icon:"📊",
   desc:"CVSS v3.1 skoring motoru. Bulgu tiplerine göre base vektör eşlemesi, auth/WAF bağlam düzeltmeleri, CVSS skoru hesaplama. Tüm raporlarda risk skoru bu modülden gelir.",
   deps:["websecure/core/reporting.py"]},
  {id:"core_egress", path:"websecure/core/egress.py", type:"core", icon:"🌍",
   desc:"Egress politikası, IP gizleme ve Tor/proxy yönetimi. Tor başlatma/kontrol, proxy pool rotasyonu, IP değiştirme, çıkış IP doğrulama.",
   deps:["websecure/core/http.py","config.json"]},
  {id:"core_ep_prio", path:"websecure/core/endpoint_prioritizer.py", type:"core", icon:"🎯",
   desc:"Akıllı endpoint önceliklendirici. Auth sayfası bonusu, parametre zenginliği, dinamik path segmenti, Content-Type, JS dosyası ve API prefix skorlama. En tehlikeli hedefleri önce tarar.",

  test:"b-test", integration:"b-integration", cli:"b-cli", db:"b-db",

const BADGE_LABEL = {
  core:"CORE", scanner:"SCANNER", wordlist:"WORDLIST", config:"CONFIG",
  test:"TEST", integration:"ENTEGRASYON", cli:"CLI", db:"VERİTABANI",
  api:"API", driver:"DRIVER", web:"WEB", tool:"ARAÇ"
};

FILES.forEach(f=>{ FILE_MAP[f.id]=f; });

// =====================================================================
// TREE RENDER
// =====================================================================
function renderTree(node, container){
  const wrapper = document.createElement('div');
  wrapper.className = 'tree-node';
  const item = document.createElement('div');
  item.className = 'tree-item';
  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  const hasChildren = node.children && node.children.length > 0;
  arrow.textContent = hasChildren ? '▶' : '';
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = node.label.split(' ')[0];
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = node.label.split(' ').slice(1).join(' ');
  item.appendChild(arrow);
  item.appendChild(label);
  if(node.badge){
    const badge = document.createElement('span');
    badge.className = 'badge ' + (BADGE_CLASS[node.badge]||'');
    badge.textContent = BADGE_LABEL[node.badge]||node.badge;
    item.appendChild(badge);
  }
  wrapper.appendChild(item);
  if(hasChildren){
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children';
    node.children.forEach(child=>renderTree(child, childContainer));
    wrapper.appendChild(childContainer);
    item.addEventListener('click', (e)=>{
      e.stopPropagation();
      const open = childContainer.classList.toggle('open');
      arrow.textContent = open ? '▼' : '▶';
    });
  }
  if(node.id && FILE_MAP[node.id]){
    item.style.cursor='pointer';
    item.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(hasChildren){
        const children = wrapper.querySelector('.tree-children');
        const a = wrapper.querySelector('.arrow');
        const open = children.classList.toggle('open');
        a.textContent = open ? '▼' : '▶';
      }
      showDetail(node.id);
    });
  }
  container.appendChild(wrapper);
}

// =====================================================================
// DETAIL POPUP
// =====================================================================
function showDetail(id){
  const f = FILE_MAP[id];
  if(!f) return;
  document.getElementById('d-title').textContent = f.path;
  const meta = document.getElementById('d-meta');
  meta.innerHTML = '';
  const t = document.createElement('span');
  t.className = 'tag ' + (BADGE_CLASS[f.type]||'');
  t.textContent = BADGE_LABEL[f.type]||f.type;
  meta.appendChild(t);
  document.getElementById('d-desc').textContent = f.desc;
  const deps = document.getElementById('d-deps');
  if(f.deps && f.deps.length > 0){
    deps.innerHTML = '<h4>🔗 Bağlı Dosyalar:</h4><ul>' +
      f.deps.map(d=>`<li>${d}</li>`).join('') + '</ul>';
  } else {
    deps.innerHTML = '<p style="color:#8b949e;font-size:11px;">Dış bağımlılık yok.</p>';
  }
  document.getElementById('detail-box').style.display='block';
  document.getElementById('overlay').style.display='block';
}
function closeDetail(){
  document.getElementById('detail-box').style.display='none';
  document.getElementById('overlay').style.display='none';
}

  {key:"core",      label:"🔬 Core Modüller (Tarama Altyapısı)"},

  {key:"integration",label:"🔌 Entegrasyon Modülleri (Harici Araçlar)"},

  {key:"api",       label:"🌐 API Modülleri"},
  {key:"db",        label:"🗄️ Veritabanı Modülleri"},
  {key:"web",       label:"🌐 Web Arayüzü"},
  {key:"test",      label:"🧪 Test Dosyaları"},
];

function buildReport(){
  const container = document.getElementById('report-content');
  CATEGORIES.forEach(cat=>{
    const files = FILES.filter(f=>f.type===cat.key || (cat.key==='config' && f.type==='tool'));
    if(!files.length) return;
    const hdr = document.createElement('div');
    hdr.className='category-header';
    hdr.innerHTML=`<span style="font-size:16px">▶</span> ${cat.label} <span style="margin-left:auto;font-size:11px;color:#8b949e">${files.length} dosya</span>`;
    const content = document.createElement('div');
    content.className='category-content';
    content.dataset.cat=cat.key;
    files.forEach(f=>{
      const card = document.createElement('div');
      card.className='file-card';
      card.dataset.search=(f.path+' '+f.desc+' '+(f.deps||[]).join(' ')).toLowerCase();
      card.innerHTML=`
        <h4>${f.path} <span class="fc-type ${BADGE_CLASS[f.type]||''}">${BADGE_LABEL[f.type]||f.type}</span></h4>
        <div class="fc-desc">${f.desc}</div>
        <div class="fc-deps">${(f.deps||[]).map(d=>`<span class="fc-dep">${d}</span>`).join('')}</div>
      `;
      content.appendChild(card);
    });
    hdr.addEventListener('click',()=>{
      const open = content.classList.toggle('open');
      hdr.querySelector('span').textContent = open ? '▼' : '▶';
    });
    container.appendChild(hdr);
    container.appendChild(content);
  });
}

function filterReport(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('.file-card').forEach(card=>{
    const match = !q || card.dataset.search.includes(q);
    card.classList.toggle('hidden', !match);
  });
  if(q){
    document.querySelectorAll('.category-content').forEach(c=>{
      const visible = Array.from(c.querySelectorAll('.file-card')).some(fc=>!fc.classList.contains('hidden'));
      c.classList.toggle('open', visible);
      const hdr = c.previousElementSibling;
      if(hdr) hdr.querySelector('span').textContent = visible ? '▼' : '▶';
    });
  }
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['tree','report'][i]===t));
  document.querySelectorAll('.pane').forEach(el=>el.classList.remove('active'));
  document.getElementById('pane-'+t).classList.add('active');
}
