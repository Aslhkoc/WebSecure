name: build

# Cross-platform standalone binary üretimi (Windows / Linux / macOS).
# - Tag push (v*)         → 3 OS binary'sini build edip GitHub Release'e ekler.
# - Elle (workflow_dispatch) → sadece build + artifact (release yok).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Release oluşturmak için

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: websecure-windows.exe
            built: dist/websecure.exe
          - os: ubuntu-latest
            artifact: websecure-linux
            built: dist/websecure
          - os: macos-latest
            artifact: websecure-macos
            built: dist/websecure
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Yalnızca exe'ye GÖMÜLEN bağımlılıklar + PyInstaller kurulur.
      # playwright/weasyprint/torch spec'te HARİÇ tutulduğu için CI'da kurulmaz
      # (hız + güvenilirlik); ilgili özellikler runtime'da iner / zarif degrade eder.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests beautifulsoup4 lxml tldextract cryptography jinja2 cvss regex PyYAML jsonschema curl-cffi tls-client cloudscraper PySocks python-Levenshtein "httpx[http2]" rich

      - name: Build standalone binary
        run: python build_exe.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
