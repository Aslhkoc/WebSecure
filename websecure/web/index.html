<!DOCTYPE html>
<html>
<head>
  <title>WebSecure Report</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const Report = ({ data }) => (
      <div className="container mx-auto p-4">
        <h1 className="text-2xl font-bold mb-4">WebSecure Report - {data.metadata.url}</h1>
        <h2 className="text-xl mb-2">Metadata</h2>
        <ul className="list-disc pl-5 mb-4">
          <li>Timestamp: {data.metadata.timestamp}</li>
          <li>Scan Duration: {data.metadata.scan_duration}</li>
          <li>Subpages Scanned: {data.metadata.total_subpages_scanned}</li>
          <li>Debug Mode: {data.metadata.debug_mode.toString()}</li>
        </ul>
        <h2 className="text-xl mb-2">Categories</h2>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <h3 className="text-lg font-semibold">Login</h3>
            <p>Status: {data.categories.login.status}</p>
            {Object.keys(data.categories.login.details).length > 0 && (
              <p>Details: {JSON.stringify(data.categories.login.details)}</p>
            )}
          </div>
          <div>
            <h3 className="text-lg font-semibold">Injection</h3>
            <ul>
              {data.categories.injection.sql_injection.map((item, index) => (
                <li key={index}>{JSON.stringify(item)}</li>
              ))}
              {data.categories.injection.xss.map((item, index) => (
                <li key={index}>{JSON.stringify(item)}</li>
              ))}
            </ul>
          </div>
          <div>
            <h3 className="text-lg font-semibold">Headers</h3>
            <ul>
              {data.categories.headers.security_headers.map((item, index) => (
                <li key={index}>{JSON.stringify(item)}</li>
              ))}
              {data.categories.headers.clickjacking.map((item, index) => (
                <li key={index}>{JSON.stringify(item)}</li>
              ))}
            </ul>
          </div>
          <div>
            <h3 className="text-lg font-semibold">Ports</h3>
            <pre>{JSON.stringify(data.categories.ports, null, 2)}</pre>
          </div>
        </div>
        <h2 className="text-xl mb-2">Summary</h2>
        <ul className="list-disc pl-5">
          <li>Total Vulnerabilities: {data.summary.total_vulnerabilities}</li>
          <li>Security Score: {data.summary.security_score}%</li>
          <li>Scan Status: {data.summary.scan_status}</li>
        </ul>
      </div>
    );

    fetch('../reports/report_example.com_20250729_225800.json') // Dinamik hale getirilebilir
      .then(response => response.json())
      .then(data => {
        ReactDOM.render(<Report data={data} />, document.getElementById('root'));
      })
      .catch(error => console.error('Error loading report:', error));
  </script>
</body>
</html>
