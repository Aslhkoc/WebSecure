[pytest]
testpaths = tests
addopts = --tb=short -q
# NOT: 'timeout = 30' kaldırıldı — pytest-timeout eklentisi hiçbir yerde kurulu
# olmadığından bu seçenek sessizce yok sayılıyordu ("Unknown config option:
# timeout") ve sahte bir koruma izlenimi veriyordu. Per-test timeout istenirse
# `pip install pytest-timeout` sonrası bu satır geri eklenebilir.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
